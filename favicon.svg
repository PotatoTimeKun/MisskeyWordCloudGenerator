<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brand Gradient: Misskey Green to Electric Cyan (matches site logo) -->
    <linearGradient id="favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86b300" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base (matching .logo-icon rounded square) -->
  <rect width="64" height="64" rx="16" fill="url(#favicon-grad)" />

  <!-- Cloud Icon (Lucide Cloud Outline, styled to match site header logo) -->
  <!-- 24x24 Lucide cloud scaled by 1.83 (44px) and centered at (10, 10) -->
  <g transform="translate(10, 10) scale(1.83)" filter="url(#soft-shadow)">
    <path
      d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
      fill="rgba(10, 14, 23, 0.15)"
      stroke="#0a0e17"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
